<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E2A47" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Condoclar</title>
    <script>
      // First-visit language autoload: send the visitor to their language if
      // we publish it. Priority: the shared *.condoclar.eu cookie (the latest
      // explicit choice made here or inside the app), then this site's stored
      // switcher choice, then the browser language. Crawlers (no JS) stay on
      // the English pages and follow the hreflang alternates instead.
      (function () {
        try {
          var langs = ['pt', 'es', 'fr', 'it', 'de'];
          var seg = location.pathname.split('/')[1];
          if (langs.indexOf(seg) !== -1) return; // already on a localised page
          var cookie = (document.cookie.match(/(?:^|;\s*)condoclar-lang=([a-z]{2})/) || [])[1];
          var pref = cookie || localStorage.getItem('condoclar-lang');
          var want = pref || (navigator.language || 'en').slice(0, 2).toLowerCase();
          if (langs.indexOf(want) !== -1) {
            location.replace('/' + want + location.pathname + location.search + location.hash);
          }
        } catch (e) {
          /* storage unavailable — stay on English */
        }
      })();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
